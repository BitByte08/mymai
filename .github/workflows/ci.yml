name: CI

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

jobs:
  # dev 로 들어오는 모든 변경(PR·push)에서 빌드 + 유닛 테스트를 돌린다.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Dockerfile(node:22-slim)과 일치
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      # TODO: test/postgres.integration.test.js 는 2026-08 storage 리팩터(clear-diff
      # 기반 성과 판정) 이전 버전을 검증한다 — hasAchievementEventLogState 등 없는
      # 메서드를 호출해 현재 실패. 테스트를 현행 postgres.ts 에 맞춰 갱신한 뒤
      # `npm run test:integration` 스텝을 여기 다시 추가할 것.

  # master 로 오는 PR 은 head 가 dev 여야 한다 (릴리스 흐름 강제).
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Require dev as the PR head branch
        shell: bash
        run: |
          if [[ "${{ github.head_ref }}" != "dev" ]]; then
            echo "::error::master can only accept pull requests from dev, but got '${{ github.head_ref }}'."
            exit 1
          fi

  build-master:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Dockerfile(node:22-slim)과 일치
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

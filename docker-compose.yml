services:
  postgres:
    image: postgres:16-alpine
    container_name: carol-postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}
    memswap_limit: ${POSTGRES_MEM_LIMIT:-256m}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carol}
      POSTGRES_USER: ${POSTGRES_USER:-carol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - carol-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    image: ghcr.io/team-carol/carol:latest
    container_name: carol-bot
    restart: unless-stopped
    mem_limit: ${BOT_MEM_LIMIT:-400m}
    memswap_limit: ${BOT_MEM_LIMIT:-400m}
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      # 메인 스레드 V8 힙 상한. 여기에 렌더 워커 개수 * 워커별 힙 상한(renderPool.ts)을 더한 값이
      # BOT_MEM_LIMIT를 넘지 않게 유지할 것 (Node 자체 오버헤드/버퍼용 여유도 남겨둬야 함).
      NODE_OPTIONS: --max-old-space-size=${NODE_MAX_OLD_SPACE_MB:-160}
      RENDER_POOL_SIZE: ${RENDER_POOL_SIZE:-1}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3456/',r=>{process.exit(r.statusCode===404?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: carol-tunnel
    restart: unless-stopped
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-64m}
    memswap_limit: ${CLOUDFLARED_MEM_LIMIT:-64m}
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      bot:
        condition: service_healthy

volumes:
  carol-postgres:
